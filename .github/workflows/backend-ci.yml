name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [document-service, verification-service, user-service]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      run: cd backend/${{ matrix.service }} && npm ci
    - name: Run tests
      run: cd backend/${{ matrix.service }} && npm test
    - name: Build
      run: cd backend/${{ matrix.service }} && npm run build