name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run core tests (simplified and edge cases)
        working-directory: ./backend
        run: npm run test:core
        env:
          MASTER_KEY_SECRET: ${{ secrets.MASTER_KEY_SECRET }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          BLOCKCHAIN_RPC_URL: ${{ secrets.BLOCKCHAIN_RPC_URL }}
          SPONSOR_WALLET_PRIVATE_KEY: ${{ secrets.SPONSOR_WALLET_PRIVATE_KEY }}
          SEPOLIA_CHAIN_ID: ${{ secrets.SEPOLIA_CHAIN_ID }}

      - name: Run complete test suite with coverage
        working-directory: ./backend
        run: npm run test:complete
        env:
          MASTER_KEY_SECRET: ${{ secrets.MASTER_KEY_SECRET }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          BLOCKCHAIN_RPC_URL: ${{ secrets.BLOCKCHAIN_RPC_URL }}
          SPONSOR_WALLET_PRIVATE_KEY: ${{ secrets.SPONSOR_WALLET_PRIVATE_KEY }}
          SEPOLIA_CHAIN_ID: ${{ secrets.SEPOLIA_CHAIN_ID }}

      - name: Run full test suite (optional, may include failing tests)
        working-directory: ./backend
        run: npm run test:full
        continue-on-error: true
        env:
          MASTER_KEY_SECRET: ${{ secrets.MASTER_KEY_SECRET }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          BLOCKCHAIN_RPC_URL: ${{ secrets.BLOCKCHAIN_RPC_URL }}
          SPONSOR_WALLET_PRIVATE_KEY: ${{ secrets.SPONSOR_WALLET_PRIVATE_KEY }}
          SEPOLIA_CHAIN_ID: ${{ secrets.SEPOLIA_CHAIN_ID }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true
