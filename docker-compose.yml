version: '3.8' # Specify compose file version

services:
  frontend:
    build:
      context: . # Build from the root context
      dockerfile: Dockerfile # Use the root Dockerfile
      target: frontend-prod # Target the final frontend stage from the Dockerfile
    ports:
      - "3000:3000" # Map host port 3000 to container port 3000
    env_file:
      - ./frontend/.env # Load environment variables from frontend/.env
    depends_on:
      - backend # Ensure backend starts before frontend
    networks:
      - authentico-net

  backend:
    build:
      context: . # Build from the root context
      dockerfile: Dockerfile # Use the root Dockerfile
      target: backend-prod # Target the final backend stage from the Dockerfile
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080 (default in Dockerfile)
    env_file:
      - ./backend/.env # Load environment variables from backend/.env
    networks:
      - authentico-net

networks:
  authentico-net: # Define a shared network for services
    driver: bridge

# Removed postgres_data volume as db service is removed
# Removed commented out services (document, verification, user, cypress)
