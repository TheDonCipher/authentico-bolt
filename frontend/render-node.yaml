services:
  # Web service (Next.js frontend) - Node.js version (no Docker)
  - type: web
    name: authentico-frontend
    env: node
    plan: starter # Consider upgrading for production
    region: ohio # Choose the region closest to your users
    branch: main
    buildCommand: npm run render:build:no-firebase
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # Enable auto-deployment on push
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://authentico-backend.onrender.com/api
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      # Firebase configuration - these should be set in the Render dashboard
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # ThirdWeb configuration
      - key: NEXT_PUBLIC_THIRDWEB_CLIENT_ID
        sync: false
      # Firebase Admin configuration - these should be set in the Render dashboard
      - key: FIREBASE_TYPE
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_AUTH_URI
        sync: false
      - key: FIREBASE_TOKEN_URI
        sync: false
      - key: FIREBASE_AUTH_PROVIDER_X509_CERT_URL
        sync: false
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false
      - key: FIREBASE_UNIVERSE_DOMAIN
        sync: false
