services:
  # Web service (Next.js frontend)
  - type: web
    name: authentico-frontend
    env: docker
    plan: starter # Consider upgrading for production
    region: ohio # Choose the region closest to your users
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1 # Consider increasing for production
    healthCheckPath: /api/health
    autoDeploy: true # Enable auto-deployment on push
    domains:
      - authentico-frontend.onrender.com # Add your custom domain if you have one
    # The build command is handled by Render's Docker integration
    # Environment variables will be automatically passed to the Docker build
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://authentico-backend.onrender.com/api # Your backend URL
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      # Firebase Client configuration - these should be set in the Render dashboard
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # ThirdWeb configuration
      - key: NEXT_PUBLIC_THIRDWEB_CLIENT_ID
        sync: false
      # Firebase Admin configuration - required for server-side Firebase operations
      - key: FIREBASE_TYPE
        value: service_account
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_AUTH_URI
        value: https://accounts.google.com/o/oauth2/auth
      - key: FIREBASE_TOKEN_URI
        value: https://oauth2.googleapis.com/token
      - key: FIREBASE_AUTH_PROVIDER_X509_CERT_URL
        value: https://www.googleapis.com/oauth2/v1/certs
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false
      - key: FIREBASE_UNIVERSE_DOMAIN
        value: googleapis.com
